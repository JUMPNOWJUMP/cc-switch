name: Build Windows (PR #6941 fix)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (commit/branch/tag from upstream farion1231/cc-switch)'
        required: false
        default: 'd8065cc628fcd373d00c4363d718095f19e78c9e'
        type: string

permissions:
  contents: read

concurrency:
  group: build-windows-6941-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64 (unsigned)
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout upstream ref
        uses: actions/checkout@v4
        with:
          repository: farion1231/cc-switch
          ref: ${{ inputs.ref || 'd8065cc628fcd373d00c4363d718095f19e78c9e' }}
          fetch-depth: 1
          submodules: recursive

      - name: Show checked-out commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rev-parse HEAD
          git log -1 --pretty=%s

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack prepare pnpm@10.12.3 --activate
          node --version
          pnpm --version

      - name: Cache pnpm store
        id: pnpm-cache
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store (restore)
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate throwaway minisign key for tauri updater
        # tauri.conf.json hardcodes plugins.updater.pubkey. tauri build requires
        # the matching private key to be present, otherwise it fails with
        # "failed to decode secret key: Wrong password for that key". We do not
        # have the real private key, so we generate a fresh keypair and then
        # rewrite the pubkey in tauri.conf.json to match. The resulting
        # installer ships with a throwaway updater pubkey (auto-update will
        # not work; the app's main functionality is unaffected).
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keyDir = Join-Path $env:RUNNER_TEMP 'tauri'
          New-Item -ItemType Directory -Force -Path $keyDir | Out-Null
          $keyPath = Join-Path $keyDir 'signing.key'
          pnpm exec tauri signer generate --ci -w $keyPath -f

          # tauri signer generate writes the public key to <keypath>.pub. The
          # file is in the same two-line minisign text format as the private
          # key. tauri.conf.json's plugins.updater.pubkey is the *entire file*
          # base64-encoded, NOT a raw 32-byte Ed25519 pubkey.
          $pubPath = "$keyPath.pub"
          if (-not (Test-Path $pubPath)) {
            throw "Public key file not found at $pubPath"
          }
          $pubBytes = [System.IO.File]::ReadAllBytes($pubPath)
          $pubB64 = [Convert]::ToBase64String($pubBytes)
          Write-Host "Public key file size: $($pubBytes.Length) bytes"
          Write-Host "Base64-encoded pubkey: $pubB64"

          # Rewrite tauri.conf.json so plugins.updater.pubkey matches.
          $confPath = 'src-tauri/tauri.conf.json'
          $conf = Get-Content -Raw $confPath | ConvertFrom-Json
          $conf.plugins.updater.pubkey = $pubB64
          $json = $conf | ConvertTo-Json -Depth 32
          Set-Content -Path $confPath -Value $json -NoNewline -Encoding utf8

          Write-Host "Updated plugins.updater.pubkey in tauri.conf.json"
          Get-ChildItem $keyDir | Format-Table Name, Length

      - name: Build Tauri (Windows x64, unsigned)
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles msi nsis
        env:
          # `tauri signer generate` produces an unencrypted minisign key;
          # do NOT set TAURI_SIGNING_PRIVATE_KEY_PASSWORD or tauri treats it
          # as a wrong-password key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/tauri/signing.key

      - name: List build outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -Path src-tauri\target\x86_64-pc-windows-msvc\release\bundle -ErrorAction SilentlyContinue |
            Select-Object FullName, Length

      - name: Stage installer artifacts
        # if: always() so the installers still get packaged even if a downstream
        # step of `tauri build` (e.g. updater signing) returns non-zero.
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $bundle = "src-tauri\target\x86_64-pc-windows-msvc\release\bundle"
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $msi = Get-ChildItem -Path (Join-Path $bundle 'msi') -Filter *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          $nsis = Get-ChildItem -Path (Join-Path $bundle 'nsis') -Filter *.exe -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $msi) { Write-Error "MSI not found under $bundle\msi"; exit 1 }
          if (-not $nsis) { Write-Error "NSIS installer (.exe) not found under $bundle\nsis"; exit 1 }

          Copy-Item $msi.FullName -Destination (Join-Path $stage $msi.Name)
          Copy-Item $nsis.FullName -Destination (Join-Path $stage $nsis.Name)

          $commitShort = '6941fix'
          $zipPath = Join-Path $env:RUNNER_TEMP "CC-Switch-6941fix-Windows-x64-$commitShort.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage, $zipPath)
          Write-Host "Staged archive: $zipPath"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-6941fix-windows-x64
          path: ${{ runner.temp }}/CC-Switch-6941fix-Windows-x64-*.zip
          if-no-files-found: error
          retention-days: 14